<div #sentinel class="scroll-sentinel" aria-hidden="true"></div>

<nav [class.scrolled]="scrolled()">
  <div class="nav-inner">
    <a [routerLink]="['/']" class="nav-logo display-title">Bautista</a>

    <ul class="nav-links">
      @for (link of navLinks; track link.fragment) {
        <li><a [routerLink]="['/']" [fragment]="link.fragment">{{ link.label }}</a></li>
      }
    </ul>

    <button
      type="button"
      class="nav-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <ul id="mobile-menu" class="mobile-menu" [class.open]="menuOpen()">
    @for (link of navLinks; track link.fragment) {
      <li><a [routerLink]="['/']" [fragment]="link.fragment" (click)="closeMenu()">{{ link.label }}</a></li>
    }
  </ul>
</nav>
